    <section class="shell section" id="chi-sono"><div class="section-head"><div><span class="eyebrow">Piacere di conoscerti</span><h2 class="section-title">Un po' di me.</h2></div><p class="section-desc">A scuola non ci sono soltanto compiti e verifiche. Ci sono persone, amicizie, risate e nuove cose da imparare.</p></div><div class="intro-grid"><article class="about-card"><span class="eyebrow">Il mio carattere</span><h3>Solare, spontaneo<br>e sempre me stesso.</h3><p>Sono un ragazzo allegro e socievole. Mi piace scherzare e stare in compagnia. Lo ammetto: quando si tratta di studiare, <strong>la voglia non è sempre al massimo!</strong> Qualche volta rimando, altre volte mi distraggo. Ma sto imparando che con piccoli passi e un po' di impegno posso migliorare.</p></article><article class="quote-card"><span class="quote-mark">“</span><blockquote>Non devo essere perfetto: devo solo trovare ogni giorno un motivo per provarci.</blockquote><small>Il mio motto per quest'anno</small></article></div></section>
    ${subjectGrid()}
    <section class="shell day-section" id="giornata"><div class="section-head"><div><span class="eyebrow">Tra un'aula e l'altra</span><h2 class="section-title">La mia vita a scuola.</h2></div><p class="section-desc">Quattro momenti che raccontano, in generale, com'è una giornata da studente di Enogastronomia.</p></div><div class="day-list"><article class="day-item"><span class="day-number">01 / SI COMINCIA</span><span class="day-emoji">🎒</span><h3>La campanella</h3><p>Si entra in classe, si salutano i compagni e si prova a cominciare con il piede giusto.</p></article><article class="day-item"><span class="day-number">02 / IN CLASSE</span><span class="day-emoji">📝</span><h3>Tra i banchi</h3><p>Le spiegazioni, gli appunti e qualche distrazione: cerco di rimanere concentrato.</p></article><article class="day-item"><span class="day-number">03 / IL LABORATORIO</span><span class="day-emoji">👨‍🍳</span><h3>Si fa pratica</h3><p>Le attività legate alla cucina e alla sala mostrano il lato concreto del nostro percorso.</p></article><article class="day-item"><span class="day-number">04 / SI RIPARTE</span><span class="day-emoji">⭐</span><h3>Domani è un altro giorno</h3><p>Una cosa capita meglio, un esercizio da recuperare e una nuova occasione per crescere.</p></article></div></section>
    <section class="shell"><div class="banner"><div class="banner-copy"><span class="eyebrow">Organizzarsi aiuta</span><h2>Interrogazione in arrivo?</h2><p>Segno le materie, gli argomenti e le date. Così posso prepararmi un po' alla volta, senza ridurmi all'ultimo minuto.</p><a class="btn" href="#interrogazioni">Apri il mio diario <span>↗</span></a></div><div class="banner-art" aria-hidden="true">A+</div></div></section>`}
    function subjectGrid(){return `<section class="subject-section" id="materie"><div class="shell"><div class="section-head"><div><span class="eyebrow">I miei studi</span><h2 class="section-title">Le mie materie <span style="color:#df935e">✳</span></h2></div><p class="section-desc">Ogni materia ha qualcosa da insegnarmi. Clicca su una scheda per leggere di cosa parla e annotare un'interrogazione.</p></div><div class="subject-grid">${subjects.map(s=>`<a class="subject-card" href="#materia/${s.id}" aria-label="Apri ${s.name}"><span class="subject-icon" style="background:${s.color}">${s.emoji}</span><h3>${s.name}</h3><span class="meta">${s.category}</span><span class="arrow" aria-hidden="true">↗</span></a>`).join('')}</div><p class="subjects-foot">Le materie indicate sono una base iniziale personalizzabile per il percorso di Jonathan.</p></div></section>`}
    function subjectPage(s){return `<section class="shell subpage"><a href="#materie" class="back-link">← Torna a tutte le materie</a><div style="margin-top:35px"><span class="eyebrow">Una materia del mio diario</span><h1 class="page-title">${s.emoji} ${s.name}</h1><p class="lead">${s.text}</p></div><div class="subject-detail"><article class="detail-panel"><span class="detail-emoji">${s.emoji}</span><h2>Quello che posso imparare</h2><p>Ogni argomento è un piccolo traguardo. Ecco alcuni spunti generali da cui partire per raccontare questa materia con parole mie.</p><ul class="prompt-list">${s.topics.map((t,i)=>`<li><span>0${i+1}</span>${t}</li>`).join('')}</ul></article><aside class="detail-panel" style="background:${s.color}"><span class="eyebrow">Il mio prossimo passo</span><h2 style="margin-top:20px">Mi preparo con calma.</h2><p>Posso iniziare dagli argomenti principali, fare qualche esercizio e chiedere spiegazioni quando non capisco qualcosa.</p><p><strong>Ho un'interrogazione di ${s.name}?</strong> La aggiungo al diario per ricordare la data.</p><button class="btn" data-add-subject="${s.id}">Segna un'interrogazione ↗</button></aside></div></section>`}
    function interrogations(){return `<section class="shell subpage"><span class="eyebrow">Date, argomenti e piccoli traguardi</span><h1 class="page-title">Le mie <span style="color:#df935e">interrogazioni.</span></h1><p class="lead">Un posto semplice dove organizzare ciò che devo studiare. Quando un'interrogazione è andata, la spunto: un pensiero in meno!</p><div class="diary-wrap"><div class="form-card"><h2>✏️ Aggiungi una data</h2><p class="hint">Inserisci solo le informazioni utili per organizzarti.</p><form id="entry-form"><label class="field">Materia<select id="entry-subject" required><option value="">Scegli la materia</option>${subjects.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></label><label class="field">Data dell'interrogazione<input id="entry-date" type="date" required></label><label class="field">Argomento da ripassare<input id="entry-topic" type="text" maxlength="90" placeholder="Es. Il testo narrativo" required></label><button class="btn" type="submit">+ Aggiungi al diario</button></form></div><div class="list-card"><div class="list-head"><h2>Il mio calendario</h2><span id="entry-count" class="counter">0 appuntamenti</span></div><div class="filters" role="group" aria-label="Filtra interrogazioni"><button class="filter ${filter==='all'?'selected':''}" data-filter="all">Tutte</button><button class="filter ${filter==='todo'?'selected':''}" data-filter="todo">Da fare</button><button class="filter ${filter==='done'?'selected':''}" data-filter="done">Completate</button></div><div id="entries-list" aria-live="polite"></div></div></div><p class="privacy-note">🔒 Le interrogazioni che aggiungi restano memorizzate soltanto nel browser di questo dispositivo. Se cancelli i dati del browser, potresti perderle. Non sono inviate a un server.</p></section>`}
    function renderEntries(){const mount=document.getElementById('entries-list');if(!mount)return;let items=readEntries().sort((a,b)=>a.date.localeCompare(b.date));const total=items.length;document.getElementById('entry-count').textContent=`${total} ${total===1?'appuntamento':'appuntamenti'}`;items=items.filter(x=>filter==='all'||(filter==='done'?x.done:!x.done));if(!items.length){mount.innerHTML=`<div class="empty"><div class="big">📅</div><h3>${total?'Qui non c’è nulla, per ora.':'Nessuna interrogazione segnata.'}</h3><p>${total?'Prova a cambiare filtro per vedere gli altri appuntamenti.':'Quando conosci la prossima data, aggiungila con il modulo qui accanto.'}</p></div>`;return}mount.innerHTML=items.map(e=>{const s=findSubject(e.subject);const d=new Date(e.date+'T12:00:00');const valid=!Number.isNaN(d.getTime());const day=valid?new Intl.DateTimeFormat('it-IT',{day:'2-digit'}).format(d):'--';const month=valid?new Intl.DateTimeFormat('it-IT',{month:'short'}).format(d).toUpperCase():'---';return `<article class="entry ${e.done?'done':''}"><div class="date-box"><b>${day}</b><small>${month}</small></div><div class="entry-content"><h3>${escapeHtml(s?s.name:'Materia')}</h3><p>${escapeHtml(e.topic)}</p><span class="status">${e.done?'✓ Completata':'• Da preparare'}</span></div><div class="entry-controls"><button class="mini-btn" data-toggle="${escapeHtml(e.id)}" title="${e.done?'Segna come da fare':'Segna come completata'}" aria-label="${e.done?'Segna come da fare':'Segna come completata'}">${e.done?'↶':'✓'}</button><button class="mini-btn" data-delete="${escapeHtml(e.id)}" title="Elimina" aria-label="Elimina interrogazione">×</button></div></article>`}).join('')}
    function route(){const hash=decodeURIComponent(location.hash.slice(1))||'home';const detail=hash.startsWith('materia/')?findSubject(hash.slice(8)):null;const isDiary=hash==='interrogazioni';app.innerHTML=detail?subjectPage(detail):isDiary?interrogations():home();document.querySelectorAll('.nav-link').forEach(a=>{const k=a.getAttribute('href').slice(1);a.classList.toggle('active',hash===k||(detail&&k==='materie'))});document.getElementById('main-nav').classList.remove('open');document.getElementById('menu-toggle').setAttribute('aria-expanded','false');if(isDiary){renderEntries();const selected=sessionStorage.getItem('jonathan-selected-subject');if(selected){document.getElementById('entry-subject').value=selected;sessionStorage.removeItem('jonathan-selected-subject')} }if(!detail&&!isDiary&&['materie','giornata','chi-sono'].includes(hash)){requestAnimationFrame(()=>document.getElementById(hash)?.scrollIntoView())}else{window.scrollTo({top:0,behavior:'instant'})}}
    window.addEventListener('hashchange',route);document.getElementById('menu-toggle').addEventListener('click',()=>{const n=document.getElementById('main-nav');const open=n.classList.toggle('open');document.getElementById('menu-toggle').setAttribute('aria-expanded',String(open))});
    document.addEventListener('click',ev=>{const btn=ev.target.closest('button');if(!btn)return;if(btn.dataset.addSubject){sessionStorage.setItem('jonathan-selected-subject',btn.dataset.addSubject);location.hash='interrogazioni'}if(btn.dataset.filter){filter=btn.dataset.filter;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('selected',b.dataset.filter===filter));renderEntries()}if(btn.dataset.toggle){const a=readEntries();const x=a.find(v=>v.id===btn.dataset.toggle);if(x){x.done=!x.done;if(writeEntries(a))renderEntries()}}if(btn.dataset.delete){const a=readEntries();if(confirm('Vuoi eliminare questa interrogazione dal diario?')){if(writeEntries(a.filter(v=>v.id!==btn.dataset.delete)))renderEntries()}}});
    document.addEventListener('submit',ev=>{if(ev.target.id!=='entry-form')return;ev.preventDefault();const subject=document.getElementById('entry-subject').value;const date=document.getElementById('entry-date').value;const topic=document.getElementById('entry-topic').value.trim();if(!findSubject(subject)||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!topic)return;const a=readEntries();a.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2,7),subject,date,topic:topic.slice(0,90),done:false});if(writeEntries(a)){ev.target.reset();filter='all';document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('selected',b.dataset.filter==='all'));renderEntries()}});
    route();
  </script>
</body>
</html>
